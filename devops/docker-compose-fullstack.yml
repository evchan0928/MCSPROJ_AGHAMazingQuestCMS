version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: agha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aghamazing_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Expose container port 5432 to host port 5433
    networks:
      - agha-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agha-pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: aghamazingdost@gmail.com
      PGADMIN_DEFAULT_PASSWORD: DOSTAGHAMazingQuestAdmin1234
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - agha-network
    depends_on:
      - postgres

  backend:
    build:
      # Use repository root as build context so shared packages (e.g., top-level `middleware/`) are available
      context: ..
      dockerfile: backend/Dockerfile
    container_name: agha-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    networks:
      - agha-network
    depends_on:
      - postgres

  frontend:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    container_name: agha-frontend
    restart: unless-stopped
    volumes:
      - /app/node_modules
      - ../frontend:/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # Needed for file watching in some environments
      - NODE_ENV=development
      # Ensure frontend knows where the backend API is (use Tailscale IP for external access)
      - REACT_APP_BACKEND_API_URL=http://100.93.255.84:8000/api
    networks:
      - agha-network
    depends_on:
      - backend
    stdin_open: true
    tty: true

  nginx:
    image: nginx:stable
    container_name: agha-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-config/agha-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - ../static:/app/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agha-network
    command: >
      sh -c "nginx -g 'daemon off;'"

networks:
  agha-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
  media_volume: