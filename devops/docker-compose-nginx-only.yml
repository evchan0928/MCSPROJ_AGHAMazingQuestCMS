version: '3.8'

services:
  nginx:
    image: nginx:stable
    container_name: agha-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-config/agha-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - ../static:/app/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agha-network
    command: >
      sh -c "nginx -g 'daemon off;'"
      
networks:
  agha-network:
    external: true