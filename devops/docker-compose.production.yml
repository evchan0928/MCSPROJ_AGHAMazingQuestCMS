version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: agha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aghamazing_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Expose container port 5432 to host port 5433
    networks:
      - agha-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: agha-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    networks:
      - agha-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: agha-frontend
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    expose:
      - "80"
    networks:
      - agha-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: agha-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # Expose nginx on port 80 (standard HTTP)
    networks:
      - agha-network
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

networks:
  agha-network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume: