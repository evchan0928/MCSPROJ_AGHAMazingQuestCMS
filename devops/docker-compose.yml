version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    command: /app/docker-entrypoint.sh
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/backend
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:stable
    env_file:
      - ../.env
    ports:
      - "${TAILSCALE_IP:-0.0.0.0}:80:80"
      - "${TAILSCALE_IP:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
