services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "until pg_isready -h ${DB_HOST:-db} -p ${DB_PORT:-5432}; do echo waiting for db; sleep 1; done; python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      DB_HOST: "host.docker.internal"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_NAME: "aghamazing_db"
      DATABASE_URL: "postgres://postgres:admin@host.docker.internal:5432/aghamazing_db"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_API_URL: ${REACT_APP_BACKEND_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
