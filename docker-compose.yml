services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aghamazing_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput && python create_admin_user.py || true && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      DB_HOST: "db"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_NAME: "aghamazing_db"
      DATABASE_URL: "postgres://postgres:admin@db:5432/aghamazing_db"
      DJANGO_SETTINGS_MODULE: config.settings.docker_compose_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_API_URL: ${REACT_APP_BACKEND_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    environment:
      - INITIAL_ADMIN_PASSWORD=admin123

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
  portainer_data: