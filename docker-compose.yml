services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "until pg_isready -h ${DB_HOST:-db} -p ${DB_PORT:-5432}; do echo waiting for db; sleep 1; done; python manage.py migrate --noinput && python manage.py load_initial_data && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      DB_HOST: "db"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_NAME: "aghamazing_db"
      DATABASE_URL: "postgres://postgres:admin@db:5432/aghamazing_db"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_API_URL: ${REACT_APP_BACKEND_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    environment:
      - INITIAL_ADMIN_PASSWORD=admin123

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
  portainer_data: