# AGHAMazingQuestCMS Nginx Configuration
# Reverse proxy configuration for Django backend and React frontend

upstream backend_server {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name 100.93.255.84;

    # Root directory for the React build files
    root /home/apcadmin/Documents/MCSPROJ_AGHAMazingQuestCMS/frontend/build;
    
    # Specific location for static files (JS, CSS, images) from React build
    location /static/ {
        alias /home/apcadmin/Documents/MCSPROJ_AGHAMazingQuestCMS/frontend/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        
        # Allow access to static files
        try_files $uri $uri/ =404;
    }

    # API requests - proxy to Django backend
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings for API responses
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Django admin - proxy to Django backend
    location /admin {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings for admin interface
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Static files for Django (CSS, JS, images for admin interface)
    location /django-static/ {
        alias /home/apcadmin/Documents/MCSPROJ_AGHAMazingQuestCMS/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Media files for Django (uploaded content)
    location /media/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Main location - serves React frontend for all other routes
    location / {
        # Handle client-side routing by serving index.html for non-API requests
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}